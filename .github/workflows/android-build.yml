name: android-build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.ci/**'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot + matching export templates
        run: WITH_TEMPLATES=1 bash tools/ci/install_godot.sh

      - name: Install Android SDK (cmdline tools, platform 35, build-tools 35)
        run: |
          set -eo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          export ANDROID_HOME="${SDK_ROOT}"
          ( yes || true ) | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" | tail -5
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"

      - name: Build debug APK
        run: bash tools/ci/build_android.sh 2>&1 | tee build.log

      - name: Describe produced APK
        if: always()
        run: |
          APK=build/microworld-living-debug.apk
          { echo "### APK listing"; ls -la build/ || true; echo; echo "### zip contents"; unzip -l "$APK" 2>&1 | head -60 || true; echo; echo "### manifest strings"; unzip -p "$APK" AndroidManifest.xml 2>/dev/null | tr -d '\0' | strings | head -40 || true; } > apk-inspect.txt 2>&1
          cat apk-inspect.txt

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=build/microworld-living-debug.apk
          ls -la "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=${SIZE}" >> "${GITHUB_ENV}"
          unzip -l "$APK" | head -30
          # The exported package must contain the game data and Godot libraries.
          unzip -l "$APK" | grep -q "assets/_data.pck\|assets/_cl_" || (echo "missing game payload"; exit 1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgodot_android.so" || (echo "missing arm64 godot lib"; exit 1)
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin
          python3 - <<'PY'
          import re, pathlib
          data = pathlib.Path('/tmp/manifest.bin').read_bytes()
          text = data.decode('utf-16-le', errors='ignore')
          needles = ['com.microworld.living', 'MICRO WORLD: LIVING']
          report = {n: (n in text) for n in needles}
          print('manifest checks:', report)
          if not all(report.values()):
              raise SystemExit('package name or label missing from manifest')
          PY

      - name: Generate SHA-256 checksum
        run: |
          sha256sum build/microworld-living-debug.apk | tee build/apk.sha256
          cp build/microworld-living-debug.apk "build/MICRO-WORLD-LIVING-${GITHUB_RUN_NUMBER}-debug.apk"
          ls -la build/

      - name: Publish build report into the repository
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .ci/android
          cp -f build.log .ci/android/ 2>/dev/null || true
          cp -f apk-inspect.txt .ci/android/ 2>/dev/null || true
          cp -f export.log .ci/android/ 2>/dev/null || true
          cat > .ci/android/summary.txt <<SUMMARY
          run=${GITHUB_RUN_ID}
          sha=${GITHUB_SHA}
          status=${JOB_STATUS}
          apk_size_bytes=${APK_SIZE_BYTES:-0}
          godot=${GODOT_VERSION}-${GODOT_CHANNEL}
          java=$("$JAVA_HOME/bin/java" -version 2>&1 | head -1)
          SUMMARY
          if [ -f build/apk.sha256 ]; then cp build/apk.sha256 .ci/android/; fi
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f .ci/android
          git commit -q -m "ci: android build ${GITHUB_RUN_ID} [skip ci]" || true
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "publish failed (non-fatal)"
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: microworld-living-debug-apk
          path: build/*.apk
          retention-days: 30

      - name: Attach APK to a GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: "MICRO WORLD: LIVING — Android debug build ${{ github.run_number }}"
          body: |
            Debug APK built from ${{ github.sha }} with Godot ${{ env.GODOT_VERSION }}.
            Install with `adb install -r MICRO-WORLD-LIVING-${{ github.run_number }}-debug.apk`.
          files: build/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
