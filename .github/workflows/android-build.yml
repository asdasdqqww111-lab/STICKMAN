name: android-build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.ci/**'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot + matching export templates
        run: WITH_TEMPLATES=1 bash tools/ci/install_godot.sh

      - name: Install Android SDK (cmdline tools, platform 35, build-tools 35)
        run: |
          set -eo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          export ANDROID_HOME="${SDK_ROOT}"
          ( yes || true ) | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" | tail -5
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"

      - name: Build debug APK
        run: bash tools/ci/build_android.sh 2>&1 | tee build.log

      - name: Describe produced APK
        if: always()
        run: |
          APK=build/microworld-living-debug.apk
          { echo "### APK listing"; ls -la build/ || true; echo; echo "### zip contents"; unzip -l "$APK" 2>&1 | head -60 || true; echo; echo "### manifest strings"; unzip -p "$APK" AndroidManifest.xml 2>/dev/null | tr -d '\0' | strings | head -40 || true; } > apk-inspect.txt 2>&1
          cat apk-inspect.txt

      - name: Verify APK contents
        run: |
          set -eo pipefail
          APK=build/microworld-living-debug.apk
          ls -la "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=${SIZE}" >> "${GITHUB_ENV}"
          unzip -l "$APK" | head -40
          FAIL=0
          unzip -l "$APK" | grep -qE "assets/.*(_data\.pck|_cl_)" || { echo "::error::missing exported game payload"; FAIL=1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgodot_android.so" || { echo "::error::missing arm64-v8a Godot library"; FAIL=1; }
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libgodot_android.so" || echo "::warning::armeabi-v7a library missing"
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin || true
          # Binary XML stores strings as UTF-16LE; -e l decodes them.
          strings -e l /tmp/manifest.bin > /tmp/manifest-strings.txt 2>/dev/null || true
          strings /tmp/manifest.bin >> /tmp/manifest-strings.txt 2>/dev/null || true
          echo "--- manifest strings ---"; head -40 /tmp/manifest-strings.txt
          grep -q "com.microworld.living" /tmp/manifest-strings.txt || { echo "::error::package id missing from manifest"; FAIL=1; }
          # Record the real SDK levels baked into the APK.  The Gradle-less export path
          # ships the prebuilt template's values, so they are measured, not overridden.
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f 2>/dev/null | head -1)
          if [ -n "${AAPT2}" ]; then
            "${AAPT2}" dump badging "${APK}" > build/badging.txt 2>&1 || true
            head -12 build/badging.txt || true
            grep -o "sdkVersion:'[0-9]*'" build/badging.txt | head -1 >> build/apk-facts.txt || true
            grep -o "targetSdkVersion:'[0-9]*'" build/badging.txt | head -1 >> build/apk-facts.txt || true
          else
            echo "::warning::aapt2 not found; SDK level not recorded"
          fi
          [ "${FAIL}" -eq 0 ] || exit 1
          # Record the real SDK levels baked into the APK.  The Gradle-less export
          # path uses the prebuilt template's values, so we measure instead of
          # pretending we can override them (Godot refuses the override without Gradle).
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | head -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" > build/badging.txt 2>&1 || true
            head -20 build/badging.txt || true
            MIN_SDK=$(grep -o "sdkVersion:'[0-9]*'" build/badging.txt | head -1 || true)
            TARGET_SDK=$(grep -o "targetSdkVersion:'[0-9]*'" build/badging.txt | head -1 || true)
            echo "MIN_SDK=$MIN_SDK" >> build/apk-facts.txt
            echo "TARGET_SDK=$TARGET_SDK" >> build/apk-facts.txt
          else
            echo "::warning::aapt2 not found; SDK level not recorded"
          fi
          grep -q "MICRO WORLD" /tmp/manifest-strings.txt || { echo "::warning::app label not found in manifest strings"; }
          exit $FAIL

      - name: Generate SHA-256 checksum
        run: |
          sha256sum build/microworld-living-debug.apk | tee build/apk.sha256
          echo "APK_SIZE_BYTES=$(stat -c %s build/microworld-living-debug.apk)" >> build/apk-facts.txt
          cat build/apk-facts.txt || true
          cp build/microworld-living-debug.apk "build/MICRO-WORLD-LIVING-${GITHUB_RUN_NUMBER}-debug.apk"
          ls -la build/

      - name: Publish build report into the repository
        if: always()
        run: |
          set -eo pipefail
          mkdir -p .ci/android
          cp -f build.log .ci/android/ 2>/dev/null || true
          cp -f apk-inspect.txt .ci/android/ 2>/dev/null || true
          cp -f build/apk-facts.txt .ci/android/ 2>/dev/null || true
          cp -f build/badging.txt .ci/android/ 2>/dev/null || true
          cp -f export.log .ci/android/ 2>/dev/null || true
          cat > .ci/android/summary.txt <<SUMMARY
          run=${GITHUB_RUN_ID}
          sha=${GITHUB_SHA}
          status=${JOB_STATUS}
          apk_size_bytes=${APK_SIZE_BYTES:-0}
          godot=${GODOT_VERSION}-${GODOT_CHANNEL}
          java=$("$JAVA_HOME/bin/java" -version 2>&1 | head -1)
          SUMMARY
          if [ -f build/apk.sha256 ]; then cp build/apk.sha256 .ci/android/; fi
          echo "APK_SIZE=${APK_SIZE_BYTES:-0}" >> .ci/android/summary.txt
          if [ -f build/apk-facts.txt ]; then echo "facts:" >> .ci/android/summary.txt; cat build/apk-facts.txt >> .ci/android/summary.txt; fi
          echo "ls:" >> .ci/android/summary.txt
          ls -la build >> .ci/android/summary.txt 2>&1 || true
          echo "manifest_raw:" >> .ci/android/summary.txt
          head -c 400 .ci/android/apk-inspect.txt >> .ci/android/summary.txt 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f .ci/android
          git commit -q -m "ci: android build ${GITHUB_RUN_ID} [skip ci]" || true
          # Two workflows may publish concurrently; rebase before every retry.
          for attempt in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
            if git push -q origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null; then
              echo "published logs (attempt ${attempt})"; break
            fi
            sleep 8
          done
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: microworld-living-debug-apk
          path: build/*.apk
          retention-days: 30

      - name: Attach APK to a GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-${{ github.run_number }}
          name: "MICRO WORLD: LIVING — Android debug build ${{ github.run_number }}"
          body: |
            Debug APK built from ${{ github.sha }} with Godot ${{ env.GODOT_VERSION }}.
            Install with `adb install -r MICRO-WORLD-LIVING-${{ github.run_number }}-debug.apk`.
          files: build/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
