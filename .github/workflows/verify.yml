name: verify

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.ci/**'

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (pinned)
        run: WITH_TEMPLATES=0 bash tools/ci/install_godot.sh

      - name: Static asset verification (hashes, rigs, clips, audio)
        run: python3 tools/check_assets.py 2>&1 | tee asset-check.log; test ${PIPESTATUS[0]} -eq 0

      - name: Import project (parses every script and imports every asset)
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log

      - name: Fail on script/import errors
        run: |
          if grep -qE "SCRIPT ERROR|Parse Error|ERROR: Failed to load" import.log; then
            echo "::error::import reported script errors"
            exit 1
          fi
          echo "import clean"

      - name: Run GDScript test suites
        run: bash tools/ci/run_tests.sh 2>&1 | tee tests.log

      - name: Browser-free asset verification scene
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --quit-after 240 scenes/AssetShowcase.tscn -- --verify 2>&1 | tee showcase.log || true
          if grep -q "SHOWCASE_RESULT: PASS" showcase.log; then
            echo "asset showcase: PASS"
          else
            echo "::error::asset showcase failed"
            exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-artifacts
          cp -f import.log tests.log showcase.log asset-check.log /tmp/current_test.log ci-artifacts/ 2>/dev/null || true
          ls -la ci-artifacts
          # Sandboxes cannot reach the artifact CDN, so the run also publishes its
          # raw logs into the repository under .ci/ (ignored by git and by this
          # workflow's own path filter) to keep results verifiable.
          mkdir -p .ci/last-run
          cp -f ci-artifacts/* .ci/last-run/ 2>/dev/null || true
          echo "run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} status=${JOB_STATUS:-unknown}" > .ci/last-run/run.txt
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f .ci/last-run
          git commit -q -m "ci: publish run ${GITHUB_RUN_ID} logs [skip ci]" || true
          for attempt in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
            if git push -q origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null; then
              echo "published logs (attempt ${attempt})"; break
            fi
            sleep 8
          done
        env:
          JOB_STATUS: ${{ job.status }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-logs
          path: ci-artifacts/
          retention-days: 14
